
x-db-environment: &db-environment
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OficinaMecanica;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env};Encrypt=True;TrustServerCertificate=True;"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oficina-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env}"

    ports:
      - "127.0.0.1:14333:1433"

    volumes:
      - oficina_sql_data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  migrate:
    image: oficina-api:local
    build:
      context: .
      dockerfile: src/Oficina.Api/Dockerfile

    command: ["dotnet", "/migrator/Oficina.DbMigrator.dll"]
    environment: *db-environment

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: "no"

  api:
    image: oficina-api:local
    build:
      context: .
      dockerfile: src/Oficina.Api/Dockerfile

    environment:
      <<: *db-environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  oficina_sql_data:
